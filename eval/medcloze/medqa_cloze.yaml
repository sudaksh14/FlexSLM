# Cloze version of medqa_4options: score the answer text, not the letter.
task: medqa_cloze
dataset_path: GBaker/MedQA-USMLE-4-options-hf
output_type: multiple_choice
test_split: test
doc_to_text: "Question: {{sent1}}\nAnswer:"
doc_to_choice: "{{[ending0, ending1, ending2, ending3]}}"
doc_to_target: label
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
